name: NAVDRISHTI CI

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  backend-lint-check:
    name: Backend Syntax & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: python -m pip install ruff==0.16.10

      - name: Check Python Syntax
        run: |
          python -m compileall -q indian

      - name: Check Python Code Quality
        run: |
          ruff check --select E9,F821,F822,F823 indian

  frontend-build-check:
    name: Frontend Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Frontend (if present)
        run: |
          if [ -d "indian/frontend" ]; then
            cd indian/frontend
            npm install --legacy-peer-deps
            npm run build
          else
            echo "Frontend directory not added yet, skipping."
          fi
